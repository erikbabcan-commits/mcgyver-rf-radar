<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#040806"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#004422" stroke-width="8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#004422" stroke-width="6"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00ff66" stroke-width="6" opacity="0.6"/>
  <circle cx="256" cy="256" r="30" fill="#00ff66"/>
